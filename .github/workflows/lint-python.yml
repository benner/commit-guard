---
name: Lint Python
on:  # yamllint disable-line rule:truthy
  pull_request:
permissions:
  contents: read
jobs:
  lint-python:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Checkout code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ruff
        # yamllint disable-line rule:line-length
        uses: benner/action-ruff@5edf345eaf6c633cc47dc35eea9b46a79ad330e3  # v0.3.1
        with:
          fail_level: error
          reporter: github-pr-review
