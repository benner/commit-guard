---
name: Lint Markdown
on:  # yamllint disable-line rule:truthy
  pull_request:
permissions:
  contents: read
jobs:
  lint-md:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Markdown files with reviewdog
        # yamllint disable-line rule:line-length
        uses: reviewdog/action-markdownlint@f8e8c509d6e706db79bb39c1c506c968f1a66b82  # v0.32.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: info
          fail_level: any
  lint-md-rumdl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Set up reviewdog
        # yamllint disable-line rule:line-length
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f  # v1.5.0
      - name: Lint Markdown files with rumdl via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          uvx rumdl check . --output-format json-lines > rumdl.jsonl || true
          jq -c '
            {
              source: {name: "rumdl"},
              severity: (.severity | ascii_upcase),
              message: .message,
              location: {
                path: .file,
                range: {start: {line: .line, column: .column}}
              },
              code: {value: .rule}
            }
          ' rumdl.jsonl \
            | reviewdog \
                -f=rdjsonl \
                -name=rumdl \
                -reporter=github-pr-review \
                -filter-mode=added \
                -fail-level=any
